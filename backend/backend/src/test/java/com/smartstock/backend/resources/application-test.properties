# Fonte única de configuração pros testes. O Spring Boot carrega este
# arquivo automaticamente pra QUALQUER teste do módulo (não precisa anotar
# nada em cada classe) -- evita duplicar essa lista de properties em
# BackendApplicationTests, IntegrationTestBase, etc.
#
# URL mágica do Testcontainers: o driver sobe um MySQL real em Docker
# sozinho, sem precisar de @Testcontainers/@Container manual. O host entre
# "://" e "/nomedobanco" é obrigatório na sintaxe (mesmo sendo ignorado --
# é só um placeholder), senão o parser da URL quebra e cai num banco padrão
# chamado "test", que foi exatamente o erro do Flyway.
spring.datasource.url=jdbc:tc:mysql:8.0://localhost/smartstock_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Segredos falsos só pra o contexto do Spring conseguir subir em teste --
# nunca os valores reais de produção.
api.security.token.secret=chaveSuperSecretaFalsaParaOsTestesRodarem1234567890
ADMIN_PASSWORD=senhaFalsaDeTeste123
DB_POOL_MAX=5
