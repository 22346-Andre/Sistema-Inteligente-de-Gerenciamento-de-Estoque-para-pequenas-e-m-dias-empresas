# --- Delfinance (Pix dinâmico pros Fiados) ---------------------------------
# Desligado por padrão: enquanto delfinance.enabled=false (ou as variáveis
# abaixo não estiverem setadas), o sistema continua gerando o Pix "copia e
# cola" estático de sempre — nada muda pra quem não configurar isso.
# Pra ativar: crie a conta em delfinance.com.br, pegue a chave de API e o
# account-id (ambiente de homologação primeiro: apisandbox.delbank.com.br),
# e configure as variáveis de ambiente abaixo no Render.
delfinance.enabled=${DELFINANCE_ENABLED:false}
delfinance.base-url=${DELFINANCE_BASE_URL:https://apisandbox.delbank.com.br}
delfinance.api-key=${DELFINANCE_API_KEY:}
delfinance.account-id=${DELFINANCE_ACCOUNT_ID:}
# Segredo compartilhado pro webhook de confirmação de pagamento (ver
# DelfinanceWebhookController) — gere uma string aleatória qualquer e
# cadastre a MESMA string ao registrar o webhook no painel da Delfinance.
delfinance.webhook-secret=${DELFINANCE_WEBHOOK_SECRET:}
