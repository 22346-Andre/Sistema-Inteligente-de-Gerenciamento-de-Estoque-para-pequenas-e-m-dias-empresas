# --- Actuator (monitoramento) -----------------------------------------------
# Expõe só health e metrics — NUNCA "env", "beans" ou "heapdump" publicamente,
# esses vazam variável de ambiente (senha do banco, chave de API) pra quem
# souber a URL. /actuator/health continua público (é o que o Render usa pra
# healthcheck); /actuator/metrics fica protegido por autenticação normal do
# Spring Security (ver SecurityConfigurations — como não está na lista de
# permitAll, cai em "anyRequest().authenticated()").
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
# Detalha o status do pool de conexão (ativo/ocioso/aguardando) dentro de
# /actuator/health — é o dado que mais importa pra ver o gargalo do Hikari
# chegando antes do cliente sentir lentidão.
management.health.db.enabled=true


