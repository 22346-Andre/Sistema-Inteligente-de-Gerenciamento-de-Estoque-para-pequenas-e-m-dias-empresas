# --- Pool de conexões (HikariCP) --------------------------------------------
# Sem isso, o Hikari usa o default (10 por instância), que não é o problema
# em si — o problema é não ter TETO CONHECIDO: se você subir uma 2ª instância
# (item de load balancer) ou o plano do Aiven tiver um limite de conexões
# simultâneas menor que "instâncias x 10", a aplicação começa a tomar
# "too many connections" do banco de forma imprevisível.
# Regra prática: (maximum-pool-size x nº de instâncias) tem que ficar
# folgado abaixo do limite de conexões do plano do Aiven. Planos pequenos
# do Aiven costumam ter teto de ~20-50 conexões simultâneas — confirme o
# valor exato no painel do Aiven (Service -> Overview -> "Max connections")
# antes de subir esse número.
spring.datasource.hikari.pool-name=SmartStockHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
# Tempo máximo esperando uma conexão livre do pool antes de estourar exceção.
spring.datasource.hikari.connection-timeout=30000
# Conexão ociosa é fechada depois de 10 min (evita segurar conexão à toa).
spring.datasource.hikari.idle-timeout=600000
# Conexão é reciclada no máximo a cada 25 min — fica abaixo de qualquer
# wait_timeout/firewall idle-timeout do proxy do Aiven, evitando erro de
# "conexão fechada pelo servidor" no meio de uma query.
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=30000
# Flyway é quem manda no schema. Hibernate só VALIDA que a entidade bate com
# a tabela — nunca mais aplica DDL sozinho em produção (isso já causou
# "sumiço"/alteração de coluna silenciosa em produção com ddl-auto=update).
# Pra depuração local, pode exportar JPA_DDL_AUTO=update no seu .env local,
# mas o padrão (e o valor em produção) tem que ser "validate".
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
# SQL de cada query no log custa I/O e polui os logs em produção; liga só
# localmente via JPA_SHOW_SQL=true se precisar depurar uma query.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
